<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart-Home GPT-2 · WebGPU</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <h1>Smart-Home GPT-2 · WebGPU</h1>

      <section class="config">
        <label>
          Model
          <select id="model">
            <option value="local:smart-home-gpt2-v7">smart-home-gpt2-v7 · FT (local) · Iter 16 (ToolACE + xLAM + Glaive, L40s bf16 ep2)</option>
            <option value="local:smart-home-gpt2-v6">smart-home-gpt2-v6 · FT (local) · Iter 15 (fresh_bench mix)</option>
            <option value="local:smart-home-gpt2-v5">smart-home-gpt2-v5 · FT (local) · Iter 13 (HF synthetic)</option>
            <option value="local:smart-home-gpt2-v4">smart-home-gpt2-v4 · FT (local) · Iter 11</option>
            <option value="local:smart-home-gpt2-v3">smart-home-gpt2-v3 · FT (local) · best</option>
            <option value="local:smart-home-gpt2-v2">smart-home-gpt2-v2 · FT (local) · may not be downloaded</option>
            <option value="local:smart-home-gpt2">smart-home-gpt2 · FT (local) · v1</option>
            <option value="lifeart/smart-home-gpt2-v3">lifeart/smart-home-gpt2-v3 · FT (HF Hub)</option>
            <option value="lifeart/smart-home-gpt2-v2">lifeart/smart-home-gpt2-v2 · FT (HF Hub)</option>
            <option value="lifeart/smart-home-gpt2">lifeart/smart-home-gpt2 · FT (HF Hub) · v1</option>
            <option value="Xenova/gpt2">Xenova/gpt2 · base (HF) · no FT</option>
          </select>
        </label>
        <label>
          Backend
          <select id="device">
            <option value="webgpu">WebGPU</option>
            <option value="wasm">WASM (CPU)</option>
          </select>
        </label>
        <label>
          Dtype
          <select id="dtype">
            <option value="fp32">fp32</option>
            <option value="fp16">fp16 (WebGPU)</option>
            <option value="q8">q8 (int8)</option>
            <option value="q4">q4 (int4)</option>
          </select>
        </label>
        <button id="load">Load model</button>
        <span id="status">idle</span>
        <div id="model-info" class="info-card" role="status" aria-live="polite"></div>
      </section>

      <section>
        <div class="row" style="margin-bottom:0.5rem">
          <label>Preset
            <select id="preset">
              <option value="" disabled selected>— pick a preset —</option>
              <option value="lighting">Lighting · "dim the bedroom light to 30 percent"</option>
              <option value="climate">Climate · "set the sunroom thermostat to 21°"</option>
              <option value="media">Media · "play Kind of Blue at 30 percent"</option>
              <option value="security">Security · "make sure the patio door is locked"</option>
              <option value="kitchen">Kitchen · "run the microwave for 60 seconds"</option>
              <option value="blinds">Blinds · "lower the bedroom blinds to halfway"</option>
              <option value="clean">Clean · "start vacuuming the living room"</option>
              <option value="garden">Garden · "water the front lawn for 15 minutes"</option>
              <option value="sensors">Sensors · "is anyone moving around in the office?"</option>
              <option value="timers">Timers · "wake me at 7am on weekdays"</option>
              <option value="mixed">Mixed (10 fns) · "activate goodnight scene + thermostat 19"</option>
            </select>
          </label>
          <span style="font-size:0.75rem;opacity:0.7;align-self:end;padding-bottom:0.5rem">↑ pick a preset, or edit the prompt below directly. With Retrieval ON, the function list is auto-replaced by MiniLM top-K — the prompt's list is only used when retrieval is off.</span>
        </div>
        <label for="prompt">Prompt (SYSTEM + candidate functions + USER command)</label>
        <textarea id="prompt" rows="8">SYSTEM: You are a helpful assistant with access to the following functions. Use them if required -
[
  "turn_on_light",
  "turn_off_light",
  "dim_light",
  "set_light_color",
  "set_light_scene"
]


USER: Dim the bedroom light to 30 percent.


ASSISTANT: &lt;functioncall&gt; </textarea>
        <div class="row">
          <label>max new tokens <input id="max" type="number" value="80" min="8" max="256" /></label>
          <label>temperature <input id="temp" type="number" value="0.0" step="0.1" min="0" max="2" /></label>
          <label title="Restrict generated tokens to a JSON schema derived from the prompt's candidate list">
            <input id="constrained" type="checkbox" checked /> Constrained decoding (JSON schema)
          </label>
          <label title="Within constrained mode: enforce per-arg-key types (enum value masking, numeric-no-quote, boolean). Iter 7.2.">
            <input id="typedargs" type="checkbox" checked /> Typed args (enum/numeric)
          </label>
          <label title="Within constrained mode: widen the name-token mask to prompt cands ∪ registry names (recovers gold names truncated out of the prompt). Iter 9.3 default ON — best ship config.">
            <input id="widenames" type="checkbox" checked /> Wide names (registry ∪ prompt)
          </label>
          <label title="Re-rank the prompt's candidate list using MiniLM cosine similarity, keep top-K">
            <input id="retrieval" type="checkbox" checked /> Retrieval pre-rank (MiniLM, top-K)
          </label>
          <label title="Number of functions kept after retrieval">
            K <input id="topk" type="number" value="3" min="1" max="10" style="width:3em" />
          </label>
          <button id="run" disabled>Generate</button>
        </div>
      </section>

      <section>
        <h2>Output</h2>
        <pre id="out"></pre>
        <h2>Bench</h2>
        <pre id="bench"></pre>
      </section>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
