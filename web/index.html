<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart-Home GPT-2 · WebGPU</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <h1>Smart-Home GPT-2 · WebGPU</h1>

      <section class="config">
        <label>
          Model
          <select id="model">
            <option value="lifeart/smart-home-gpt2-v14-ctx4096" selected>smart-home-gpt2-v14-ctx4096 · 4096-token context · Hugging Face Hub</option>
            <option value="lifeart/smart-home-gpt2-v9">smart-home-gpt2-v9 · 1024-token context · loads locally</option>
          </select>
        </label>
        <label>
          Backend
          <select id="device">
            <option value="webgpu">WebGPU</option>
            <option value="wasm">WASM (CPU)</option>
          </select>
        </label>
        <label>
          Dtype
          <select id="dtype">
            <option value="fp32">fp32</option>
            <option value="fp16">fp16 (WebGPU)</option>
            <option value="q8">q8 (int8)</option>
          </select>
        </label>
        <button id="load">Load model</button>
        <span id="status">idle</span>
        <div id="model-info" class="info-card" role="status" aria-live="polite"></div>
        <div id="dtype-info" class="info-card dtype-info" role="status" aria-live="polite"></div>
      </section>

      <section>
        <div class="row" style="margin-bottom:0.5rem">
          <label>Try a realistic command
            <select id="preset">
              <option value="" disabled selected>— pick an example command —</option>
            </select>
          </label>
          <span style="font-size:0.75rem;opacity:0.7;align-self:end;padding-bottom:0.5rem">↑ pick a real end-user phrasing, or edit the prompt below. These are casual commands (implied rooms, vague values, questions) for validating the assistant on lifelike input.</span>
        </div>
        <div class="row voice-row" style="margin-bottom:0.5rem">
          <button id="mic" type="button" title="Record a spoken command. Whisper transcribes it in-browser (no server, no API) and drops it into the USER line below.">🎤 Speak a command</button>
          <span id="voice-status" style="font-size:0.78rem;opacity:0.78;align-self:center"></span>
        </div>
        <label for="prompt">Prompt (SYSTEM + candidate functions + USER command)</label>
        <textarea id="prompt" rows="8">SYSTEM: You are a helpful assistant with access to the following functions. Use them if required -
[
  "turn_on_light",
  "turn_off_light",
  "dim_light",
  "set_light_color",
  "set_light_scene"
]


USER: Dim the bedroom light to 30 percent.


ASSISTANT: &lt;functioncall&gt; </textarea>
        <div class="row">
          <label>max new tokens <input id="max" type="number" value="80" min="8" max="256" /></label>
          <label>temperature <input id="temp" type="number" value="0.0" step="0.1" min="0" max="2" /></label>
          <label title="Restrict generated tokens to a JSON schema derived from the prompt's candidate list">
            <input id="constrained" type="checkbox" checked /> Constrained decoding (JSON schema)
          </label>
          <label title="Within constrained mode: enforce per-arg-key types (enum value masking, numeric-no-quote, boolean). Iter 7.2.">
            <input id="typedargs" type="checkbox" checked /> Typed args (enum/numeric)
          </label>
          <label title="Within constrained mode: widen the name-token mask to prompt cands ∪ registry names (recovers gold names truncated out of the prompt). Iter 9.3 default ON — best ship config.">
            <input id="widenames" type="checkbox" checked /> Wide names (registry ∪ prompt)
          </label>
          <label title="Re-rank the prompt's candidate list using MiniLM cosine similarity, keep top-K. Off by default so the demo uses the full tool schemas in the prompt; turn on to simulate a large tool registry.">
            <input id="retrieval" type="checkbox" /> Retrieval pre-rank (MiniLM, top-K)
          </label>
          <label title="Number of functions kept after retrieval">
            K <input id="topk" type="number" value="3" min="1" max="10" style="width:3em" />
          </label>
          <button id="run" disabled>Generate</button>
        </div>
      </section>

      <section>
        <h2>Output</h2>
        <pre id="out"></pre>
        <div id="synth-out"></div>
        <h2>Bench</h2>
        <pre id="bench"></pre>
      </section>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
