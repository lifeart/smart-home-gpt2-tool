name: Deploy demo to GitHub Pages

# Builds the in-browser demo in web/ and publishes it to GitHub Pages at
#   https://lifeart.github.io/smart-home-gpt2-tool/
#
# The build does NOT include any model weights — web/public/models/ is a local
# dev cache that does not exist on CI, and vite.config.js already excludes it
# from the build output (it builds from a models-free mirror of public/). At
# runtime transformers.js streams the models from the Hugging Face Hub.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent deployment; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build (GitHub Pages base path)
        working-directory: web
        # SITE_BASE makes vite emit asset URLs under the project sub-path.
        env:
          SITE_BASE: /smart-home-gpt2-tool/
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
